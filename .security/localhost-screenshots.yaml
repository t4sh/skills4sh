dependencies:
  - name: playwright
    type: npm
    optional: true
    version: "1.65.1"
    reason: "Required only for the bundled capture scripts (capture.js, quick.js, multi-breakpoint.js, screenshot-a11y.js); the host browser path has no dependencies. The scripts use the project's own playwright or @playwright/test when one resolves and never change its version; this pin is installed only when neither resolves. Never install with @latest or an unversioned npm install."
  - name: pixelmatch
    type: npm
    optional: true
    version: "8.0.0"
    reason: "Required only by compare.js for before/after comparisons. compare.js refuses pixelmatch 7 and earlier, whose diff counts use a different colour metric."
  - name: pngjs
    type: npm
    optional: true
    version: "7.0.0"
    reason: "Required only by compare.js to read captures and write diff images."

mitigations:
  - id: COMMAND_EXECUTION
    addressed_in: "3.3.0"
    note: "Removed `sudo npx playwright install-deps` and replaced `node -e \"…\"` checks with an explicit `playwright@1.62.0` install before browser setup. Stdin-friendly templates moved to versioned `assets/scripts/*.js` files."
  - id: PROMPT_INJECTION
    addressed_in: "3.3.0"
    note: "SKILL.md policy rule 3 treats page content, including text visible in a screenshot, as untrusted data. ARIA, DOM, and interactive-map captures are written wrapped in an `{ boundary: 'untrusted-page-content', source, … }` envelope; the bundled `assets/scripts/screenshot-a11y.js` enforces the envelope. `capture.js` returns no page text and repeats only the origin of a URL the page chose."
  - id: SUPPLY_CHAIN
    addressed_in: "3.3.0"
    note: "Documented `npm ci` + lockfile pinning or explicit version installs, never `@latest` or unversioned installs. An existing project Playwright is used as is and never overridden. `compare.js` accepts only pixelmatch 8 or later and names the exact pins (`pixelmatch@8.0.0`, `pngjs@7.0.0`). `ignoreHTTPSErrors` is gated to localhost-only hostnames."
  - id: NETWORK_SCOPE
    addressed_in: "3.3.7"
    note: "3.3.7 added the requested-URL and final-URL checks, but its route handler never saw HTTP redirect hops, so a redirect to an external host was loaded before being rejected and a local-external-local bounce passed. After 3.5.0 the bundled helpers pause main-frame document requests through a Chromium CDP Fetch session and fail any request to a non-local hostname before it is sent: every redirect hop and every later page-initiated navigation. They also re-check the completed redirect chain and the final URL, and write no capture when a navigation was blocked. Subframes and other subresources are not intercepted. Observed with Playwright 1.62.0 and 1.65.1 driving Chrome 158 on 2026-11-21. The guard is one shared module, `assets/scripts/local-guard.js`, required by `capture.js`, `quick.js`, `multi-breakpoint.js`, and `screenshot-a11y.js`. A browser the agent only drives through host tools cannot install it: on that path the skill requires checking the URL before and after navigation and before each capture and discarding the capture on a mismatch (detect and discard, not block)."

scanning:
  guardskills: SAFE
  guardskills_risk_score: 0
  guardskills_note: "After 3.3.2: no sudo, no `node -e`, no plaintext example credentials. ARIA and DOM captures carry untrusted-content envelopes."
  snyk: pass
  codeql: pass
  expected_findings:
    - id: R005_SECRET_READ
      severity: high
      confidence: medium
      acknowledged: true
      file: references/playwright-patterns.md
      reason: "False positive. The Persistent Browser Sessions example references `process.env.HOME || process.env.USERPROFILE` to compute a `~/.cache/localhost-screenshots/` profile directory — no credentials or secrets are read; the path stores browser cookies/localStorage for multi-step screenshot workflows."
    - id: R005_SECRET_READ
      severity: high
      confidence: medium
      acknowledged: true
      file: references/interaction-templates.md
      reason: "False positive. The Auth → Dashboard template reads `process.env.DEMO_USER` / `DEMO_PASS` as an example of sourcing demo-environment credentials from the environment instead of hardcoding them — this is the secure pattern guardskills R005 is intended to encourage."
    - id: R008_ENV_ACCESS
      severity: low
      file: references/playwright-patterns.md
      reason: "Code examples reference process.env.HOME/USERPROFILE for the optional persistent-session profile directory."
    - id: R008_ENV_ACCESS
      severity: low
      file: references/interaction-templates.md
      reason: "Code examples read process.env.DEMO_USER / DEMO_PASS for screenshot login flows — credentials are sourced from the environment instead of being hardcoded."
