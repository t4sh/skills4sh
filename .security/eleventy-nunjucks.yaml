    optional: true
    version: "4.0.0-alpha.10"
    reason: "Optional, exactly pinned Build Awesome v4 prerelease migration track"
  - name: markdown-it
    type: npm
    optional: false
    version: ">=14.0.0"
    reason: "Markdown engine used in all referenced project patterns"
  - name: tailwindcss
    type: npm
    optional: true
    version: ">=4.0.0"
    reason: "Tooling pairing for the dev/build pipeline; skill is usable without it"
  - name: prettier-plugin-jinja-template
    type: npm
    optional: true
    reason: ".njk formatting; recommended for consistent template formatting"
  - name: concurrently
    type: npm
    optional: true
    reason: "Used in the canonical dev script to run Tailwind + 11ty in parallel"

scanning:
  guardskills: SAFE
  guardskills_risk_score: 100
  guardskills_note: "guardskills scan-local reports R005_SECRET_READ (HIGH) on documentation lines that name `.env`, `process.env`, or `$GITHUB_OUTPUT`; none reads or transmits secret material. The skill ships no executable files, but references/security-checklist.md embeds a copyable scripts/security-audit.sh template that greps local src/ and output files and sends a HEAD request with curl to a user-supplied target URL; review it before running."
  snyk: pass
  codeql: pass
  expected_findings:
    - id: R005_SECRET_READ
      severity: high
      confidence: medium
      acknowledged: true
      file: references/build-pipeline.md
      reason: "False positive — CI example writes a build timestamp to `$GITHUB_OUTPUT` (~L270) and a stray-output check runs `find out -name '.env*'` (~L278); neither reads secrets."
    - id: R008_ENV_ACCESS
      severity: low
      confidence: low
      file: references/build-pipeline.md
      reason: "CI workflow template writes build metadata to GITHUB_OUTPUT and passes it through environment variables for reproducible builds."
    - id: R005_SECRET_READ
      severity: high
      confidence: medium
      acknowledged: true
      file: references/data-cascade.md
      reason: "False positive — `process.env` reads of non-secret build values (SITE_BASE_URL, COMMIT_SHA, BUILT_AT) with fallbacks (~L34, L104-110)."
    - id: R008_ENV_ACCESS
      severity: low
      confidence: low
      file: references/data-cascade.md
      reason: "Documentation references process.env with fallbacks for build-time data."
    - id: R005_SECRET_READ
      severity: high
