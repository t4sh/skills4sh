scanning:
  guardskills: SAFE
  guardskills_risk_score: 96
  guardskills_note: "guardskills@1.6.0 scan-local reports SAFE. Findings are the environment-scrubbing uv launcher and isolated temporary-environment setup examples, not skill-side execution. See expected_findings."
  snyk: pass
  codeql: pass
  expected_findings:
    - id: R005_SECRET_READ
      severity: high
      confidence: medium
      acknowledged: true
      file: assets/scripts/run_uv.py
      reason: "False positive, first reported by guardskills 1.6.0. run_uv.py copies the process environment with every UV_* variable removed and passes the copy to uv through os.execvpe, so host uv configuration cannot redirect the isolated install. It reads no secret, and writes, logs, or sends no variable."
    - id: R008_ENV_ACCESS
      severity: low
      confidence: low
      file: assets/scripts/run_uv.py
      reason: "run_uv.py reads os.environ only to build the child environment for uv without UV_* variables."
    - id: R008_ENV_ACCESS
      severity: low
      confidence: low
      file: references/helper-runtime.md
      reason: "The temporary-venv fallback stores its generated path in a shell variable so every install and helper invocation stays inside the same isolated environment."
    - id: R009_FILE_STAGE
      severity: low
      confidence: low
      file: references/helper-runtime.md
      reason: "The documented fallback creates a temporary virtual environment for pinned validation dependencies; it does not stage user skill content or execute automatically."
