name: Validate Skills

on:
  push:
    paths:
      - 'skills/**'
      - 'skills-lock.json'
      - 'package-lock.json'
      - 'package.json'
      - 'README.md'
      - 'SECURITY.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.security/**'
      - '.cursor-plugin/**'
      - '.claude-plugin/**'
      - '.github/workflows/validate.yml'
      - '.github/scripts/verify-versions.sh'
      - 'bin/**'
      - 'tests/**'
  # Always run on PRs so branch-protection can require `validate (22)` and
  # `validate (24)` without blocking PRs that don't touch the listed paths.
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # drift-check.mjs uses `git show HEAD^:skills/<x>/SKILL.md` for the
          # semver monotonicity check. Default fetch-depth (1) hides HEAD^ on
          # push events and the check silently skips. Depth 2 is the minimum
          # needed for the previous-commit comparison.
          fetch-depth: 2

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install validation and render-test dependencies
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")" --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m venv /tmp/skills4sh-python
          /tmp/skills4sh-python/bin/python -m pip install --only-binary=:all: -r skills/skill-architect/assets/scripts/requirements.txt
          echo "SKILL_TEST_PYTHON=/tmp/skills4sh-python/bin/python" >> "$GITHUB_ENV"
          npm ci --prefix tests/fixtures/eleventy --ignore-scripts --no-audit --no-fund
          npm ci --prefix tests/fixtures/visual --ignore-scripts --no-audit --no-fund

      - name: Validate portable skill syntax and links
        run: |
          for skill_dir in skills/*/; do
            "$SKILL_TEST_PYTHON" skills/skill-architect/assets/scripts/validate_skill.py "$skill_dir"
          done

      - name: Check skill completeness
        run: |
          errors=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            skill_errors=0
            echo "Checking $name completeness..."

            [ -f "$dir/SKILL.md" ] || { echo "  ERROR: Missing SKILL.md"; errors=$((errors + 1)); skill_errors=$((skill_errors + 1)); }
            [ -f ".security/$name.yaml" ] || { echo "  ERROR: Missing .security/$name.yaml"; errors=$((errors + 1)); skill_errors=$((skill_errors + 1)); }

            if [ "$skill_errors" -eq 0 ]; then
              echo "  OK"
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "Found $errors completeness error(s)"
            exit 1
          fi

      - name: Verify skill authoring standard
        run: npm run check:skill-standard

      - name: Collect PR changed files
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only HEAD^1...HEAD > /tmp/pr-changed-files.txt

      - name: Verify PR skill audit packet
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CHANGED_FILES_PATH: /tmp/pr-changed-files.txt
        run: npm run check:pr-skill-audit

      - name: Verify content hashes (AST01/AST02)
        run: node bin/hash-check.mjs

      - name: Verify version consistency (AST07)
        run: bash .github/scripts/verify-versions.sh

      - name: Verify docs and security manifests do not drift
        run: npm run check:drift

      - name: Verify npm package payload
        run: npm run check:pack

      - name: Run installer, helper, and snippet tests
        run: node --test tests/*.test.mjs
